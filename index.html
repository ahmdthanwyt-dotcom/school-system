<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بوابة متابعة سلوك الطلاب - سما حوران</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style> body { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-4 sm:p-6">
  <div id="loader" class="fixed inset-0 bg-slate-900/50 flex flex-col items-center justify-center z-50 text-white font-bold text-sm">
    <div class="animate-spin rounded-full h-10 w-10 border-4 border-amber-400 border-t-transparent mb-3"></div>
    جاري جلب البيانات الفورية من السحابة...
  </div>
  <div class="max-w-4xl mx-auto space-y-4">
    <header class="bg-white p-4 rounded-2xl border shadow-sm flex justify-between items-center">
      <div>
        <h1 class="text-base font-extrabold text-slate-900">سجل الطلاب وسلوكهم</h1>
        <p class="text-xs text-slate-400" id="sync-time">جاري التحميل...</p>
      </div>
      <button onclick="loadFastData()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-3 py-2 rounded-xl transition">
        <i class="fa-solid fa-rotate"></i> تحديث
      </button>
    </header>
    <div class="bg-white p-4 rounded-2xl border shadow-sm">
      <input type="text" id="search-box" oninput="filterStudents()" placeholder="ابحث باسم الطالب أو الكود..." class="w-full p-2.5 border rounded-xl outline-none text-xs font-bold bg-slate-50">
    </div>
    <div id="students-container" class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs"></div>
  </div>
  <script>
    const CDN_URL = "https://cdn.jsdelivr.net/gh/USERNAME/REPO@main/data/school_cache.json";
    let cachedStudents = [];
    window.onload = loadFastData;
    async function loadFastData() {
      document.getElementById('loader').classList.remove('hidden');
      try {
        const res = await fetch(CDN_URL + "?t=" + new Date().getTime());
        const data = await res.json();
        cachedStudents = data.allStudents || [];
        document.getElementById('sync-time').innerText = "آخر مزامنة: " + new Date(data.updatedAt).toLocaleTimeString('ar-SA');
        renderList(cachedStudents);
      } catch (err) {
        document.getElementById('students-container').innerHTML = "<p class='text-rose-500 text-center col-span-2 py-4'>يرجى التأكد من مسار المستودع واسم المستخدم.</p>";
      } finally {
        document.getElementById('loader').classList.add('hidden');
      }
    }
    function renderList(list) {
      const container = document.getElementById('students-container');
      container.innerHTML = "";
      if (list.length === 0) {
        container.innerHTML = "<p class='text-slate-400 text-center col-span-2 py-4'>لا توجد بيانات طلاب متوفرة.</p>";
        return;
      }
      list.forEach(st => {
        container.innerHTML += `
          <div class="bg-white p-3 rounded-xl border shadow-xs flex justify-between items-center">
            <div>
              <span class="font-bold text-slate-900 block">${st.name}</span>
              <span class="text-[10px] text-slate-400">${st.class} (${st.section})</span>
            </div>
            <div class="text-left">
              <span class="font-black text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200">${st.score} نقطة</span>
              <span class="text-[9px] text-slate-400 block mt-0.5 font-mono">#${st.id}</span>
            </div>
          </div>
        `;
      });
    }
    function filterStudents() {
      const q = document.getElementById('search-box').value.trim().toLowerCase();
      const filtered = cachedStudents.filter(s => (s.name && s.name.toLowerCase().includes(q)) || (s.id && String(s.id).includes(q)));
      renderList(filtered);
    }
  </script>
</body>
</html>
